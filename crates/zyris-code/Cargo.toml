[package]
name = "zyris-code"
version = "0.1.0"
edition = "2021"
description = "Attacca 에이전트와 대화하는 터미널 클라이언트 (ratatui)"
license = "MIT OR Apache-2.0"

[lib]
name = "zyris_code"
path = "src/lib.rs"

[[bin]]
name = "zyris-code"
path = "src/main.rs"

[dependencies]
zyris.workspace = true
zyris-attacca.workspace = true
zyris-caps.workspace = true
zyris-capkit.workspace = true

# Used by the code `#[zyris::capability]` generates. **Match the version to upstream** — if
# different, the macro's generated types differ from upstream's and the traits don't line up.
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.91"

ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# `process` and `io-util` are used to spawn the MCP server as a child process and exchange lines with it.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
unicode-width = "0.2"
anyhow = "1.0"
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# Line-based diff. Hand-rolling it gets slow on big files, and that happens inside the tool-call budget.
similar = "2"
# The worker ripgrep uses. **Respecting `.gitignore` is the point** — searching target/ would
# cost seconds on this machine and only yield build artifacts. Its glob matching is used too.
ignore = "0.4"
regex = "1"
futures-util = "0.3.32"
base64 = "0.23.0"
# PID liveness check for the window lock (`conn::instance_lock`). Already in the tree, so it builds without network.
libc = "0.2"
# Version token for the edit tool (SHA-256). Already in Cargo.lock, so it builds without network.
sha2 = "0.10"

[dev-dependencies]
# Tool tests write real files. A mock filesystem can't catch path-resolution mistakes.
tempfile = "3"
# Installs the commit hook into `.git/hooks` the first time `cargo test` runs
# (Rust counterpart of simple-git-hooks). Hook scripts live in `.cargo-husky/hooks/`;
# the `commit-msg` one enforces Conventional Commits. Set
# CARGO_HUSKY_DONT_INSTALL_HOOKS=true to skip installation.
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
