[workspace]
resolver = "2"
members = ["crates/zyris-code"]

# The zyris crates are git dependencies pulled from GitHub. Declare them once here, and sub-crates
# attach with `workspace = true` — declaring per-crate would let them see different commits,
# and then the same crate gets linked twice, causing a "same type but the types differ" error.
#
# Without `rev`, Cargo.lock is the only pin, so a single `cargo update` quietly jumps to
# the latest of the default branch. Bumping is done deliberately by editing this line.
#
# **Don't attach via a local path.** On 2026-08-03 the `../zyris` working tree was attached via
# `[patch]`, and when the directory vanished with that change committed nowhere, even
# `cargo metadata` failed. At the time zyris-code leaned on code **only we knew about**, and with a
# single copy there was nothing to recover with. Open a PR, merge it, and write that commit here — never attach by path.
#
# The `rev` below is `3e5dc1b`, the merge of zyris-protocol#45, which carries `ZSessionEvent.id` on top of the merge of
# zyris-protocol's `cancel_turn` delivery point and `ZTurnFrame::Cancelled`
# (zyris-protocol#44): a moved event can now be recognised by id.
[workspace.dependencies]
zyris = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "3e5dc1b1542e73e960d4b28e25495de61ed0da7c", features = ["enroll"] }
zyris-attacca = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "3e5dc1b1542e73e960d4b28e25495de61ed0da7c" }
# The capability declarations (`zyris-caps`) and the two reference implementations this node serves
# (`zyris-fs`, `zyris-terminal`). **All five must be the same rev** — otherwise the same crate gets
# linked twice, causing a "same type but the types differ" error.
#
# The wire types (`CapabilityDescriptor`, `Payload`, etc.) are re-exported at the root by `zyris`,
# so `zyris-proto` isn't pulled separately. The `zyris::serve` module is also private; only its items appear at the root.
#
# **`zyris-capkit` is gone from here.** It became a re-export shell in front of one crate per
# implementation, and the reason for the split is a reason to move rather than to lean on the
# shell: `zyris-input` pins a git fork of `enigo`, and while `LocalFileIo` and `PtyTerminal` shared
# a crate with it none of them could be published. Taking the two crates this node actually serves
# also means the graphics stack is not a feature flag away — `zyris-screen` links X11, Wayland,
# D-Bus and PipeWire, and turning that on here used to block the build on this machine for want of
# dev packages. Now it cannot be turned on by accident because it is not named.
#
#   zyris_capkit::LocalFileIo  -> zyris_fs::LocalFileIo
#   zyris_capkit::PtyTerminal  -> zyris_terminal::PtyTerminal
#   zyris_capkit::resolve_under -> zyris_caps::resolve_under   (moved *down*, to the declarations)
zyris-caps = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "3e5dc1b1542e73e960d4b28e25495de61ed0da7c" }
zyris-fs = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "3e5dc1b1542e73e960d4b28e25495de61ed0da7c" }
zyris-terminal = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "3e5dc1b1542e73e960d4b28e25495de61ed0da7c" }

# **The repository was renamed** `attacca-cc/zyris` -> `attacca-cc/zyris-protocol`. GitHub redirects
# the old name, so the old URL kept resolving — until somebody creates a repository at the name it
# was freed from, and then it resolves to that instead. The URL above is the real one.
#
# **`features = ["enroll"]` is also how the TLS provider gets chosen.** Upstream spells it
# `enroll = ["dep:reqwest", "tls-ring"]`, and that is deliberate on their side: enrolment is an
# HTTPS device-grant flow, so a build that can enrol without TLS does not exist. Neither provider is
# on by default, and rustls with no provider named panics on the first `wss://` — `zyris` refuses
# that dial by name (`ConnectError::NoTlsProvider`) instead, but a node that cannot dial is still a
# node that cannot dial. Dropping `enroll` here would cost this app both halves at once.
#
# **What upstream stopped doing, this app does itself now.** `zyris::runtime::{Runner, RunConfig,
# RunError}`, `zyris::runtime::credentials::*` and `zyris::enroll::{CredentialStore,
# FileCredentialStore, …}` were deleted when zyris became a library, and that is the right call
# rather than a regression: backoff, exit codes, and where on this machine a secret may be written
# are properties of a program, not of a protocol. They live in `src/runtime/` here — a port, not a
# fork. **APIs that don't exist upstream are still not recreated on a local branch of zyris**; that
# is what made 2026-08-03 unrecoverable, and owning the program layer in *this* repo is the way
# round it that leaves one copy of everything in a repository that has a remote.
#
# The per-app credential directory is set by us filling `$ZYRIS_CONFIG_DIR` (`conn::credential_dir`)
# because there is no `RunConfig::app` to set, and the scope check is done by us after connecting
# (`app.rs`).

# Full debug symbols make the target directory grow to tens of GB. On this machine it has actually
# filled the disk and frozen the system. Keep the line info needed for backtraces.
[profile.dev]
debug = "line-tables-only"
