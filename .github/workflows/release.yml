name: release

# Cutting a release is pushing a tag. Everything below follows from that one act, so there is
# nothing to remember and no button to press in the right order.
#
# `workflow_dispatch` exists so the whole thing can be rehearsed against an existing tag without
# inventing a new version — a release workflow that can only ever be tried in production is a
# release workflow nobody dares change.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and (re)publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  # Backtraces cost nothing here and turn a bare "build failed" into something readable.
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # **One target failing must not take the others down.** A missing platform is worth shipping
    # late; a release with nothing in it is not. The publish job below uploads whatever arrived.
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not the newest runner: the binary then needs only glibc 2.35 rather than
          # whatever the latest image happens to carry, which is the difference between running
          # on an ordinary server and not.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            # rustls pulls in C (ring, aws-lc-rs), so cross-compiling needs a cross C toolchain,
            # not just the Rust target.
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          # **Both Apple targets build on the arm64 runner.** The Intel image (macos-13) is
          # retired, so a job asking for it sits in the queue and never starts — which held the
          # whole release, since publishing waits on every build. The macOS SDK carries both
          # architectures, so cross-compiling from arm64 needs nothing but the Rust target.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get update
            sudo apt-get install -y "${{ matrix.apt }}"
          fi

      - name: Build
        shell: bash
        env:
          # Both spellings: cargo wants one, the `cc` crate the other.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.linker }}
        # `--locked` because a release must be built from the versions that were reviewed, not
        # whatever resolved on the day.
        run: cargo build --release --locked --target "${{ matrix.target }}" -p zyris-code

      - name: Package
        shell: bash
        # **The archive name carries no version.** That is what makes
        # `releases/latest/download/zyris-code-<target>.tar.gz` a stable address, which is the
        # address the install scripts use.
        run: |
          set -eu
          name="zyris-code-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$name.zip" "./target/${{ matrix.target }}/release/zyris-code.exe" LICENSE-MIT LICENSE-APACHE README.md
          else
            staging="$(mktemp -d)"
            cp "target/${{ matrix.target }}/release/zyris-code" "$staging/"
            cp LICENSE-MIT LICENSE-APACHE README.md "$staging/"
            tar -czf "dist/$name.tar.gz" -C "$staging" .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    # **Runs even when a target failed**, so one broken platform does not withhold the rest.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # **The notes are written from the history**, so the default shallow clone is not
          # enough: with depth 1 there is no previous tag to compare against and the release
          # would go out saying nothing changed.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Collect and checksum
        id: collect
        shell: bash
        run: |
          set -eu
          # The install scripts are shipped as assets so that `curl -fsSL .../install.sh` has one
          # address that always points at the newest release.
          cp install.sh install.ps1 dist/
          cd dist
          # Nothing at all means every build failed; publishing an empty release would look like
          # a release that simply does not work on your machine.
          count="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "every build failed — refusing to publish an empty release" >&2
            exit 1
          fi
          sha256sum ./* > SHA256SUMS
          # `sha256sum -c` wants the names it was given, and `./x` reads badly in release notes.
          sed -i 's| \./| |' SHA256SUMS
          cat SHA256SUMS
          echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        shell: bash
        env:
          TAG: ${{ steps.collect.outputs.tag }}
        run: |
          set -eu
          # **The notes say what changed; the README says how to install.** Install instructions
          # copied into every release go stale one release at a time and nobody notices, because
          # each page looks right on its own. One place holds them, and this links to it.
          #
          # The list is the commits since the previous tag. Merges are left out: on this repo they
          # carry a pull request number and no description of the change.
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          # **A release that needs something said goes and says it, at the top.**
          # `docs/release-notes/<tag>.md` is read if it is there and ignored if it is not, so a
          # one-off — an upgrade that behaves oddly once, a setting whose meaning changed — is
          # written for the release it belongs to and cannot follow the next one out. A paragraph
          # kept in this file instead would, and nobody would notice for a version or two.
          note="docs/release-notes/$TAG.md"
          {
            if [ -f "$note" ]; then
              cat "$note"
              printf '\n'
            fi
            printf '## What changed\n\n'
            if [ -n "$prev" ]; then
              git log --no-merges --reverse --pretty='- %s' "$prev..$TAG"
              printf '\n[Full diff](https://github.com/%s/compare/%s...%s)\n\n' \
                "$GITHUB_REPOSITORY" "$prev" "$TAG"
            else
              git log --no-merges --reverse --pretty='- %s' "$TAG"
              printf '\n'
            fi
            printf '## Install\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh   # macOS, Linux\n' "$GITHUB_REPOSITORY"
            printf 'irm https://github.com/%s/releases/latest/download/install.ps1 | iex        # Windows\n' "$GITHUB_REPOSITORY"
            printf '```\n\n'
            printf 'To pin this version: `... | sh -s -- --version %s`.\n\n' "$TAG"
            printf 'Everything else — what it does, how to run it, every environment variable —\n'
            printf 'is in the [README](https://github.com/%s#readme).\n\n' "$GITHUB_REPOSITORY"
            printf '### Verifying a download\n\n'
            printf 'Every archive is listed in `SHA256SUMS`, which the install scripts check before\n'
            printf 'unpacking anything. By hand:\n\n'
            printf '```sh\n'
            printf 'sha256sum -c SHA256SUMS --ignore-missing\n'
            printf '```\n\n'
            printf '### Files\n\n'
            printf '| Platform | Archive |\n|---|---|\n'
            printf '| Linux x86_64 | `zyris-code-x86_64-unknown-linux-gnu.tar.gz` |\n'
            printf '| Linux aarch64 | `zyris-code-aarch64-unknown-linux-gnu.tar.gz` |\n'
            printf '| macOS Apple silicon | `zyris-code-aarch64-apple-darwin.tar.gz` |\n'
            printf '| macOS Intel | `zyris-code-x86_64-apple-darwin.tar.gz` |\n'
            printf '| Windows x86_64 | `zyris-code-x86_64-pc-windows-msvc.zip` |\n\n'
            printf 'A platform missing from the release means its build failed; the others are\n'
            printf 'published regardless.\n'
          } > notes.md
          cat notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
        # `gh` is on the runner already, so the release needs no third-party action. Re-running
        # against a tag that already has a release replaces the assets rather than failing.
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag
          fi
